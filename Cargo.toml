[package]
name = "qemu_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
ron = "0.8"
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["x11", "wayland"] }

[profile.dev.package.naga]
opt-level = 2
codegen-units = 1

[profile.dev.package.wgpu]
opt-level = 2
codegen-units = 1

[profile.dev.package.wgpu-core]
opt-level = 2
codegen-units = 1

[profile.dev.package.wgpu-hal]
opt-level = 2
codegen-units = 1
