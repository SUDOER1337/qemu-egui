[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = "off"

# Fast linker: rust-lld (~2-3x faster link than GNU ld)
# CI skips this section because it uses MSVC target
[target.x86_64-pc-windows-gnu]
linker = "C:\\Users\\USER\\.rustup\\toolchains\\stable-x86_64-pc-windows-gnu\\lib\\rustlib\\x86_64-pc-windows-gnu\\bin\\rust-lld.exe"
rustflags = ["-C", "link-arg=--threads=8"]

# Local-only overrides (not available on CI):
# - Set `RUSTC_WRAPPER = "sccache"` in your shell for faster re-builds
