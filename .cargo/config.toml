[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
lto = "off"

# Fast linker: rust-lld (~2-3x faster link than GNU ld)
# Wrapper script resolves rust-lld via %RUSTUP_HOME% — no hardcoded username needed.
[target.x86_64-pc-windows-gnu]
linker = "tools/lld-link.cmd"
rustflags = ["-C", "link-arg=--threads=8"]

# Linux host: fast mold linker (via gcc/clang driver)
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "link-arg=-Wl,--threads=8"]

# Local-only overrides (not available on CI):
# - Set `RUSTC_WRAPPER = "sccache"` in your shell for faster re-builds
